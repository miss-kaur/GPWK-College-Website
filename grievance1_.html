<body target="_blank">
<div class="container">
	<h2 align="center">Online Grievances Form</h2>
	<form action="" method="post" enctype="multipart/form-data" name="form1" id="form1">
		<div class="table-responsive">
			<table class="table" width="80%">
		  		<tbody>
					<tr>
						<td colspan="2" bgcolor="#B9FFFD"><p><strong>Name</strong><input name="First Name" type="text" id="First Name" size="30" placeholder="First Name" /><input name="Last Name" type="text" id="Last Name" size="30" placeholder="Last Name"/></td>
					</tr>
					<tr>

					</tr>
					<tr>
						<td colspan="2" bgcolor="#B9FFFD"><strong>Email</strong><input type="text" name="Email" id="Email" placeholder="Email"/></td>
						
					</tr>
					<tr>
					  <td colspan="2" bgcolor="#B9FFFD"><strong>Please write here your Grievances/ Problem</strong><input name="First Name" type="text" id="any" size="109" placeholder="Enter details" /></td>
					</tr>
					<tr>
					  <td colspan="2" bgcolor="#B9FFFD" align="center"><input type="submit" id="submit" value="Submit your Details"/></td>
