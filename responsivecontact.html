<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
}

* {
    box-sizing: border-box;
}

/* Style inputs */
input[type=text],[type=email], textarea{
    width: 100%;
	border-radius:20px;
    padding: 12px;
    border: 1px solid #93022c;
    margin-top: 6px;
    margin-bottom: 16px;
    resize: vertical;
}

input[type=submit] {
    background-color: #f27209;
	border-radius:10px;
    color: white;
    padding: 12px 20px;
    border: none;
    cursor: pointer;
}

input[type=submit]:hover {
    background-color: #93022c;
}

/* Style the container/contact section */
.container {
    border-radius: 10px;
    background-color: #d4fcf9;
    padding: 10px;
}

/* Create two columns that float next to eachother */
.column {
    float: left;
    width: 50%;
    margin-top: 6px;
    padding: 20px;
}

/* Clear floats after the columns */
.row:after {
    content: "";
    display: table;
    clear: both;
}

/* Responsive layout - when the screen is less than 600px wide, make the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 600px) {
    .column, input[type=submit] {
        width: 100%;
        margin-top: 0;
    }
}
</style>
</head>
<body>
<div class="container">
  <div style="text-align:center">
    <h2>Contact Us for any details</h2>
  </div>
  <div class="row">
    <div class="column">
      <div id="map" style="width:100%;height:575px;border:2px solid #93022c;border-radius:10px;"></div>
    </div>
    <div class="column">
      <form action="mailto:pankaj.pathik@gmail.com" method="post" enctype="text/plain">
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="firstname" placeholder="Your First name.." required>
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lastname" placeholder="Your Last name..">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Your E-mail.." required>
		<label for="phone">Phone/ Mobile No.</label>
        <input type="text" id="phone" name="phone" placeholder="Your Mobile No.." required>
        <label for="subject">Suggestion/ Query</label>
        <textarea id="subject" name="subject" placeholder="Write something.." style="height:170px"></textarea>
        <input type="submit" value="Submit">
      </form>
    </div>
  </div>
</div>

<script>
// Initialize google maps
function myMap() {
  var myCenter = new google.maps.LatLng(30.965834,77.105538);
  var mapCanvas = document.getElementById("map");
  var mapOptions = {center: myCenter, zoom: 17};
  var map = new google.maps.Map(mapCanvas, mapOptions);
  var marker = new google.maps.Marker({position:myCenter});
  marker.setMap(map);
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC7INd8_dcFr93-V2MDdoiLEmPbOcCzU1o&callback=myMap"></script>

-->

</body>
</html>
